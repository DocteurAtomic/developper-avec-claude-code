[project]
name = "pachaplan"
version = "0.4.0"
description = "Planning helper for the PachaData training team: session fill rates, trainer days, unpaid invoices, monthly export."
readme = "README.md"
license = "MIT"
authors = [{ name = "DocteurAtomic" }]
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
]

[project.scripts]
pachaplan = "pachaplan.cli:main"
pachaplan-mcp = "pachaplan.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
