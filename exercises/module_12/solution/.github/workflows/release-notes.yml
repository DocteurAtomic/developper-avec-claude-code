# Writes the release notes of a pushed tag with Claude Code, then publishes them
# as the GitHub release of that tag. Needs the CLAUDE_CODE_OAUTH_TOKEN secret,
# made by `claude setup-token`; without it the first step fails the run.
name: release-notes

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the Claude token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty: run claude setup-token, then gh secret set CLAUDE_CODE_OAUTH_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.314
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write the release notes
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -o pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          claude -p "Write the release notes of $TAG for the users of pachaplan, from the commits in $prev..$TAG (git log $prev..$TAG). Markdown, one bullet per user-visible change, grouped under Added, Changed and Fixed; leave out a group that would be empty. Output only the notes, with no report and no closing remarks." \
            --permission-mode dontAsk \
            --allowedTools "Bash(git log:*),Bash(git show:*)" \
            --max-turns 10 \
            --output-format json < /dev/null > run.json
          # claude can exit 0 without having done the work: the notes decide.
          jq -r '"\(.subtype), \(.num_turns) turns, \(.permission_denials | length) refused"' run.json
          jq -e '.is_error == false' run.json > /dev/null
          jq -r .result run.json > notes.md
          if ! grep -q '^- ' notes.md; then
            echo "::error::No release notes in the answer of claude:"; cat notes.md; exit 1
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
