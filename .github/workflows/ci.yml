# Runs the tests and the linter on every push to main, on every tag
# and on every pull request.
name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python and the dependencies
        run: uv sync
      - name: Tests
        # The real database is in the repository; setting the variable runs the
        # integration and characterization tests instead of skipping them, and
        # --fail-on-skip fails the build if any test is still skipped.
        env:
          PACHAPLAN_DB: data/pachaplan.sqlite
        run: uv run pytest -q --fail-on-skip
      - name: Lint
        run: uv run ruff check
