# First review of every pull request by Claude Code, before the human review.
# The review goes to the log of the run. Needs the CLAUDE_CODE_OAUTH_TOKEN secret
# (claude setup-token); without it the job says so and stops without failing.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# The action gets this workflow's token instead of the Claude GitHub App token, so
# these are all the rights it has: read the code and the pull request.
permissions:
  contents: read
  pull-requests: read

# A new push to the same pull request cancels the review still running.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the Claude token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN secret (or a pull request from a fork): review skipped."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
          # Do not leave the token in .git/config, where a command could use it.
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Review the changes of this pull request, from git diff origin/${{ github.base_ref }}...HEAD.
            List the defects first (bugs, missing tests, a CLAUDE.md or README that the change makes wrong),
            each with its file and line, then the questions for the author. Do not rewrite the code.
          claude_args: >-
            --permission-mode dontAsk
            --allowedTools "Bash(git diff:*),Bash(git log:*)"
            --max-turns 15
